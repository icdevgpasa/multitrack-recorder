name: multitrack_engine
description: "Low-latency multi-track record/playback engine (iOS: AVAudioEngine)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: MultitrackEnginePlugin
